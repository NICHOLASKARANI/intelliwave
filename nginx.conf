upstream wavecore_backend {
    least_conn;
    server wavecore-1:3000;
    server wavecore-2:3000;
    server wavecore-3:3000;
}

server {
    listen 80;
    server_name www.intelliwavve.com;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=wavecore:10m rate=10r/s;
    limit_req zone=wavecore burst=20 nodelay;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://wavecore_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}